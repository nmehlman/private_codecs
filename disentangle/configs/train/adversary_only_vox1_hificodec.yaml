# Adversary-only contrastive training on Vox1 with HifiCodec features

random_seed: 42
gpus: "0"
dataset_name: "vox1"
codec_name: "hificodec"
input_type: "quantized_embedding"
max_epochs: 100

# Where checkpoints, tensorboard logs, and the config copy are saved
log_dir: "/project2/shrikann_35/nmehlman/logs/private_codecs/adversary_only/vox1_hificodec"

# Optional: path to a pretrained SexDisentangleModule checkpoint. If set, the
# adversary is trained on the frozen AE's latents instead of raw codec features
# (in that case also provide the matching `lightning:` section from the AE's config).
ae_ckpt: null

# Dataset options:
dataset:
  train_val_spks_split_file: "/project2/shrikann_35/nmehlman/data/svpp-data/vox1/priv_codec_train_val_skp.json"
  dataset_path: "/project2/shrikann_35/DATA/Vox1/codec_feats/"
  codec: "hificodec"
  split: "dev"
  use_vg_sex_embeddings: true

# Dataloader options:
dataloader:
  batch_size: 128
  num_workers: 4

# Adversary options:
model:
  codec_dim: 512
  emotion_dim: 256
  adversarial_channels: [256, 256, 256]
  tau_cl: 0.07
  tau_st: 0.07
  soft_loss_weight: 0.0
  learning_rate: 0.001
  weight_decay: 0.001
  normalize_input: true
  lr_scheduling: false
  gradient_clip_val: 100.0
