# Basic training configuration for Expresso with Encodec features

---
random_seed: 42
ckpt_path: null
gpus: "0"
dataset_name: "vox1"
dataset_sr: 16000
codec_name: "hificodec"
input_type: "quantized_embedding"

run_asr_eval: true
cache_dir: "/project2/shrikann_35/nmehlman/logs/private_codecs/audio_eval_cache/"
num_cached_samples: 1000

# Dataset options:
dataset:
  train_val_spks_split_file: "/project2/shrikann_35/nmehlman/data/svpp-data/vox1/priv_codec_train_val_skp.json"
  dataset_path: "/project2/shrikann_35/DATA/Vox1/codec_feats/"
  codec: "hificodec"
  split: "dev"

audio_eval_dataset:
  data_dir: "/project2/shrikann_35/nmehlman/data/svpp-data/vox1/" 
  audio_subdir: "vox1_dev_wav"

# Dataloader options:
dataloader:
  batch_size: 128
  num_workers: 4

# Model options:
lightning:
  codec_dim: 512
  emotion_dim: 256
  latent_dim: 64
  enc_channels: [256, 128]
  dec_channels: [256]
  learning_rate: 0.001
  weight_decay: 0
  normalize_input: true
  use_adversarial: true
  lr_scheduling: false
  adv_annealing_steps: 50000 
  adv_loss_weight: 0.25
  adv_update_factor: 5  
  gradient_clip_val: 100.0
  ae_warmup_steps: 10000
  log_gradients: false

# Training options:
trainer:
  max_epochs: 1
  limit_train_batches: 16
  limit_val_batches: 16
  val_check_interval: 1.0 # Must be >= 1 for iterable-type dataset
  log_every_n_steps: 10    
  sync_batchnorm: True
  accelerator: "gpu"
  devices: "auto"
  detect_anomaly: False

# Tensorboard options:
tensorboard:
  save_dir: "/project2/shrikann_35/nmehlman/logs/private_codecs/tensorboard/gender"
  name: "debug" 
  version: null  
