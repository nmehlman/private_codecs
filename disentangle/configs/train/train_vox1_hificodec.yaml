# Basic training configuration for Expresso with Encodec features

---
random_seed: 42
ckpt_path: null
gpus: "0"
dataset_name: "vox1"
dataset_sr: 16000
codec_name: "hificodec"
input_type: "quantized_embedding"

# Dataset options:
dataset:
  train_val_spks_split_file: "/project2/shrikann_35/nmehlman/data/svpp-data/vox1/priv_codec_train_val_skp.json"
  dataset_path: "/project2/shrikann_35/DATA/Vox1/codec_feats/"
  codec: "hificodec"
  split: "dev"

# Dataloader options:
dataloader:
  batch_size: 64
  num_workers: 4

# Model options:
lightning:
  codec_dim: 512
  latent_dim: 64
  emotion_dim: 256
  enc_channels: [256, 128]
  dec_channels: [256]
  learning_rate: 0.001
  weight_decay: 0
  normalize_input: true
  use_adversarial: true
  lr_scheduling: false
  adv_annealing_steps: 50000 
  adv_loss_weight: 0.25
  adv_update_factor: 5  
  gradient_clip_val: 100.0

# Training options:
trainer:
  max_epochs: 250
  val_check_interval: 1.0 # Must be >= 1 for iterable-type dataset
  log_every_n_steps: 10    
  sync_batchnorm: True
  accelerator: "gpu"
  devices: "auto"
  deterministic: False
  detect_anomaly: False

# Tensorboard options:
tensorboard:
  save_dir: "/project2/shrikann_35/nmehlman/logs/private_codecs/tensorboard"
  name: "debug"
  version: null  
